name = "atria-tg-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"

# KV فقط برای dedup سبک (اختیاری) — conversation در DO است
[[kv_namespaces]]
binding = "DEDUP_KV"
id = "394aa4e0f3fb41b387269e9b4d4eefaa"

# Durable Object
[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession"]

# برای secret ها از `wrangler secret put` استفاده کن
# BOT_TOKEN, BOT_USERNAME, BOT_ID, ATRIA_API_KEY, WEBHOOK_
